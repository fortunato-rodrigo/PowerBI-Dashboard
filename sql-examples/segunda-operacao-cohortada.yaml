question_variants:
  - "Qual % dos clientes adquiridos em cada mês fizeram segunda operação?"
  - "Taxa de segunda operação por safra de aquisição"
  - "Cohort de segunda operação por mês de aquisição"
  - "Quantos clientes da safra de março fizeram mais de uma op?"
sql: |
  WITH aquisicoes AS (
    SELECT
      id_customer,
      DATE_TRUNC('month', MIN(processed_date)) AS cohort_month,
      MIN(processed_date) AS first_op_date
    FROM gold.fact_operations
    WHERE is_ops_processed = TRUE
      AND is_intercompany = FALSE
      AND operation_event_type = 'Aquisição'
    GROUP BY id_customer
  ),
  segunda AS (
    SELECT DISTINCT fo.id_customer
    FROM gold.fact_operations fo
    JOIN aquisicoes a ON fo.id_customer = a.id_customer
    WHERE fo.is_ops_processed = TRUE
      AND fo.is_intercompany = FALSE
      AND fo.processed_date > a.first_op_date
  )
  SELECT
    a.cohort_month,
    COUNT(DISTINCT a.id_customer) AS acquired,
    COUNT(DISTINCT s.id_customer) AS made_second_op,
    ROUND(100.0 * COUNT(DISTINCT s.id_customer) / NULLIF(COUNT(DISTINCT a.id_customer), 0), 2) AS second_op_rate_pct
  FROM aquisicoes a
  LEFT JOIN segunda s ON a.id_customer = s.id_customer
  GROUP BY 1
  ORDER BY 1 DESC
tables_used: [gold.fact_operations]
notes: "operation_event_type='Aquisição' identifica 1ª op. Segunda op = qualquer op posterior sem restrição de prazo. Para janela de 30 dias, ver sql-examples/clientes-segunda-op-30-dias.yaml."
